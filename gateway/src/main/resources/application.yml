spring:
  application:
    name: gateway
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dualbot}
    username: ${DB_USER:dualbot}
    password: ${DB_PASSWORD:dualbot}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC

server:
  port: ${GATEWAY_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api/openapi
  swagger-ui:
    path: /api/docs

dualbot:
  # SPEC §6: set at deploy time; the gateway fails to start when any is missing.
  hard:
    max-subscriptions-per-day: ${HARD_MAX_SUBSCRIPTIONS_PER_DAY:6}
    max-per-subscription-usdt: ${HARD_MAX_PER_SUBSCRIPTION_USDT:}
    max-total-usdt: ${HARD_MAX_TOTAL_USDT:}
